# Deploy on Render, so Meta talks to a real public URL and ngrok stops
# mattering. Sending was never the problem - receiving needs a public address,
# and this is the cheapest way to have one that doesn't depend on your laptop
# being awake.
#
#   1. push this repo to GitHub
#   2. Render -> New -> Blueprint -> pick the repo
#   3. fill in the env vars marked sync:false in the dashboard
#   4. point Meta's callback at  https://<your-service>.onrender.com/webhook
#
# The free tier sleeps after ~15 minutes idle and takes ~50s to wake. Meta will
# retry the messages it sent during that wake-up, which is exactly why dedup
# lives in a UNIQUE constraint rather than in memory.
#
# Data lives in Postgres, not a file: the free tier has no persistent disk, so
# a SQLite file is wiped on every single deploy - along with every report and
# every decision an officer made.

databases:
  - name: aapdaai-db
    plan: free
    databaseName: aapdaai
    user: aapdaai

services:
  - type: web
    name: aapdaai-backend
    runtime: python
    plan: free
    region: singapore            # closest to India of the free regions
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"            # 3.13 removed audioop; nothing here needs it,
                                 # but 3.12 is the safer floor for wheels
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: OFFICER_NUMBER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Wired automatically from the database above. Its presence is what
      # switches the app from SQLite to Postgres - nothing else changes.
      - key: DATABASE_URL
        fromDatabase:
          name: aapdaai-db
          property: connectionString
